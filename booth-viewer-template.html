<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Booth Preview — 3x3 Design A</title>
<!-- Free, no signup: Google's model-viewer web component -->
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #111;
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  }
  model-viewer {
    width: 100%;
    height: 100vh;
    background-color: #1a1a1a;
    --poster-color: transparent;
  }
  .label {
    position: fixed;
    top: 16px;
    left: 16px;
    color: #fff;
    font-size: 15px;
    background: rgba(0,0,0,0.45);
    padding: 8px 14px;
    border-radius: 8px;
    z-index: 10;
  }
  .hint {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    color: #ddd;
    font-size: 13px;
    background: rgba(0,0,0,0.45);
    padding: 6px 12px;
    border-radius: 8px;
    z-index: 10;
  }
</style>
</head>
<body>

<div class="label">Booth Design — 3x3</div>

<!-- 
  REPLACE:
  - src            -> path/URL to your .glb file
  - poster         -> (optional) a preview image shown while the model loads
  - alt            -> description of the booth
-->
<model-viewer
  src="a3-booth-3x3.glb"
  poster="booth-3x3-designA-poster.jpg"
  alt="3x3 exhibition booth design A"
  camera-controls
  auto-rotate
  auto-rotate-delay="0"
  rotation-per-second="20deg"
  shadow-intensity="1"
  exposure="1"
  camera-orbit="45deg 65deg auto"
  min-camera-orbit="auto 10deg auto"
  max-camera-orbit="auto 100deg auto"
  ar
  ar-modes="webxr scene-viewer quick-look"
  touch-action="pan-y">
  <div class="hint" slot="progress-bar"></div>
</model-viewer>

<div class="hint">Drag to orbit · Scroll to zoom · Tap AR icon to view in your space (mobile)</div>

</body>
</html>
